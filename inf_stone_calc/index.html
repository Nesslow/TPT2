<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stone Console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="rail">
  <div class="rail-mark">
    <span class="name">STONE CONSOLE</span>
    <span class="tag">Infinity Stone Calculator v2</span>
  </div>

  <button class="rail-link active" data-view="overview" onclick="showView('overview')"><span class="glyph">&#9673;</span> Overview</button>
  <button class="rail-link" data-view="guide" onclick="showView('guide')"><span class="glyph">?</span> Guide</button>
  <button class="rail-link" data-view="data" onclick="showView('data')"><span class="glyph">&#8645;</span> Import / export</button>
  <button class="rail-link" data-view="regions" onclick="openRegions()"><span class="glyph">&#9635;</span> Regions</button>

  <div class="rail-group-label">Stones</div>
  <div id="rail-stones"></div>

  <div class="rail-group-label">Sandbox</div>
  <div id="rail-test"></div>
</div>

<div class="main">
  <div class="topbar">
    <div class="crumb" id="crumb">Overview</div>
    <button class="perk-toggle" onclick="togglePerk()">Twin Singularity<div class="switch" id="perk-switch"></div></button>
  </div>
  <div id="view-container"></div>
</div>

<script src="stone-calc.js"></script>
<script src="regions.js"></script>
<script src="stones.js"></script>
<script src="import-decode.js"></script>
<script src="app.js"></script>
<script src="data-view.js"></script>

</body>
</html>
